name: Verify published image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  IMAGE_NAME: ghcr.io/ikurdenkov/devops-ci-app
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull latest tag
        run: docker pull "${IMAGE_NAME}:latest"
      - name: Run latest tag and check health
        run: |
          set -euo pipefail
          docker run -d --name ci-app -p 127.0.0.1:5001:5000 "${IMAGE_NAME}:latest"
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5001/health; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5001/
          docker exec ci-app id
          docker inspect --format '{{.Config.Image}}' ci-app
          docker rm -f ci-app
      - name: Pull full SHA tag
        run: docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
      - name: Run SHA tag and check health
        run: |
          set -euo pipefail
          docker run -d --name ci-app-sha -p 127.0.0.1:5002:5000 "${IMAGE_NAME}:${GITHUB_SHA}"
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5002/health; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5002/
          docker exec ci-app-sha id
          docker inspect --format '{{.Config.Image}}' ci-app-sha
          docker image inspect --format '{{json .RepoDigests}}' "${IMAGE_NAME}:${GITHUB_SHA}"
          docker rm -f ci-app-sha
